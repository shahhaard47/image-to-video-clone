version: "3.9"

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - app-data:/data
    env_file:
      - .env

  worker:
    build: .
    command: python -m app.worker
    volumes:
      - ./:/app
      - app-data:/data
    env_file:
      - .env

volumes:
  app-data:

